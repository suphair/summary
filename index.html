<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>В этот день</title>
<style>
  :root { --bg: #fff; --fg: #222; --muted: #777; --link: #1a5fb4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1b1b; --fg: #e6e6e6; --muted: #999; --link: #8ab4f8; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 Georgia, serif; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 1.6em; margin: 0 0 .5em; }
  h2 { font-size: 1.2em; margin: 1.5em 0 .5em; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin: .4em 0; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .year { color: var(--muted); margin-right: .5em; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main id="out"></main>
<script>
const SITES = [
  'https://thesolovyovs.blogspot.com',
  'https://miuchimsyadoma.blogspot.com',
];

let seq = 0;
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = '__feed' + (seq++);
    const s = document.createElement('script');
    window[cb] = data => { delete window[cb]; s.remove(); resolve(data); };
    s.onerror = () => { delete window[cb]; s.remove(); reject(new Error(url)); };
    s.src = url + '&callback=' + cb;
    document.head.appendChild(s);
  });
}

function feedUrl(site, params) {
  return site + '/feeds/posts/summary?alt=json-in-script&orderby=published&' + params;
}

async function postsOnDay(site, md, year) {
  const first = await jsonp(feedUrl(site, 'max-results=1'));
  const total = +first.feed.openSearch$totalResults.$t;
  if (!total) {
    return [];
  }
  const tz = first.feed.entry[0].published.$t.slice(-6);
  const oldest = await jsonp(feedUrl(site, 'max-results=1&start-index=' + total));
  const days = [];
  for (let y = +oldest.feed.entry[0].published.$t.slice(0, 4); y <= year; y++) {
    if (md === '02-29' && new Date(y, 1, 29).getMonth() !== 1) {
      continue;
    }
    const day = y + '-' + md;
    days.push(jsonp(feedUrl(site, 'max-results=150'
      + '&published-min=' + encodeURIComponent(day + 'T00:00:00' + tz)
      + '&published-max=' + encodeURIComponent(day + 'T23:59:59.999' + tz))));
  }
  const feeds = await Promise.all(days);
  return feeds.flatMap(f => f.feed.entry || []).map(e => ({
    published: e.published.$t,
    title: e.title.$t || '(без названия)',
    url: e.link.find(l => l.rel === 'alternate').href,
  }));
}

function render(site, posts) {
  const sec = document.createElement('section');
  const h = document.createElement('h2');
  h.textContent = new URL(site).hostname;
  const ul = document.createElement('ul');
  for (const p of posts) {
    const li = document.createElement('li');
    const y = document.createElement('span');
    y.className = 'year';
    y.textContent = p.published.slice(0, 4);
    const a = document.createElement('a');
    a.href = p.url;
    a.textContent = p.title;
    li.append(y, a);
    ul.append(li);
  }
  sec.append(h, ul);
  return sec;
}

(async () => {
  const now = new Date();
  const md = String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
  const results = await Promise.all(SITES.map(site => postsOnDay(site, md, now.getFullYear())));
  const out = document.getElementById('out');
  SITES.forEach((site, i) => {
    const posts = results[i]
      .sort((a, b) => a.published.localeCompare(b.published));
    if (posts.length) {
      out.append(render(site, posts));
    }
  });
  if (out.children.length) {
    const h = document.createElement('h1');
    h.textContent = now.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    out.prepend(h);
  }
})();
</script>
</body>
</html>
